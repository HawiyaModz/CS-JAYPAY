<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Room AI - Empero</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .chat-container {
            width: 100%;
            max-width: 800px;
            height: 90vh;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
        }

        .chat-header {
            padding: 20px 25px;
            background: rgba(255, 255, 255, 0.08);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
            flex-wrap: wrap;
            gap: 10px;
        }

        .chat-header h1 {
            color: #fff;
            font-size: 20px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .chat-header h1 span {
            background: linear-gradient(135deg, #667eea, #764ba2);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 500;
            color: #fff;
        }

        .header-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .header-actions button {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: #aaa;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.3s;
        }

        .header-actions button:hover {
            background: rgba(255, 255, 255, 0.2);
            color: #fff;
        }

        .header-actions button.danger:hover {
            background: rgba(255, 70, 70, 0.3);
            color: #ff6b6b;
        }

        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px 25px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .messages::-webkit-scrollbar {
            width: 5px;
        }

        .messages::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
        }

        .messages::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
        }

        .message {
            max-width: 80%;
            padding: 12px 18px;
            border-radius: 15px;
            line-height: 1.5;
            word-wrap: break-word;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            align-self: flex-end;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: #fff;
            border-bottom-right-radius: 5px;
        }

        .message.ai {
            align-self: flex-start;
            background: rgba(255, 255, 255, 0.1);
            color: #e0e0e0;
            border-bottom-left-radius: 5px;
        }

        .message.error {
            align-self: center;
            background: rgba(255, 70, 70, 0.2);
            color: #ff6b6b;
            border: 1px solid rgba(255, 70, 70, 0.3);
            max-width: 90%;
            text-align: center;
        }

        .message .timestamp {
            font-size: 10px;
            opacity: 0.5;
            margin-top: 5px;
            display: block;
        }

        .message .role-label {
            font-size: 10px;
            font-weight: 600;
            opacity: 0.6;
            margin-bottom: 4px;
            display: block;
        }

        .message.ai .role-label {
            color: #a78bfa;
        }

        .message.user .role-label {
            color: #c4b5fd;
        }

        .typing-indicator {
            align-self: flex-start;
            background: rgba(255, 255, 255, 0.08);
            padding: 12px 20px;
            border-radius: 15px;
            display: none;
            gap: 4px;
        }

        .typing-indicator.active {
            display: flex;
        }

        .typing-indicator span {
            width: 8px;
            height: 8px;
            background: #a78bfa;
            border-radius: 50%;
            animation: typing 1.4s infinite;
        }

        .typing-indicator span:nth-child(2) {
            animation-delay: 0.2s;
        }
        .typing-indicator span:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes typing {
            0%,
            60%,
            100% {
                transform: translateY(0);
                opacity: 0.4;
            }
            30% {
                transform: translateY(-8px);
                opacity: 1;
            }
        }

        .input-area {
            padding: 15px 25px 20px;
            background: rgba(255, 255, 255, 0.05);
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            gap: 12px;
            flex-shrink: 0;
        }

        .input-area textarea {
            flex: 1;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 12px 16px;
            color: #fff;
            font-size: 14px;
            resize: none;
            outline: none;
            font-family: inherit;
            min-height: 50px;
            max-height: 120px;
            transition: border-color 0.3s;
        }

        .input-area textarea:focus {
            border-color: #667eea;
        }

        .input-area textarea::placeholder {
            color: #666;
        }

        .input-area button {
            background: linear-gradient(135deg, #667eea, #764ba2);
            border: none;
            color: #fff;
            padding: 0 28px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.3s;
            white-space: nowrap;
        }

        .input-area button:hover {
            transform: scale(1.03);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .input-area button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .status-bar {
            padding: 8px 25px;
            background: rgba(255, 255, 255, 0.03);
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            font-size: 11px;
            color: #555;
            display: flex;
            justify-content: space-between;
            flex-shrink: 0;
            flex-wrap: wrap;
            gap: 5px;
        }

        .status-bar .status-dot {
            display: inline-block;
            width: 7px;
            height: 7px;
            border-radius: 50%;
            margin-right: 6px;
        }

        .status-bar .status-dot.online {
            background: #4ade80;
        }

        .status-bar .status-dot.offline {
            background: #f87171;
        }

        .status-bar .status-dot.checking {
            background: #fbbf24;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%,
            100% {
                opacity: 1;
            }
            50% {
                opacity: 0.3;
            }
        }

        @media (max-width: 600px) {
            .chat-container {
                height: 95vh;
                border-radius: 10px;
            }

            .chat-header h1 {
                font-size: 16px;
            }

            .message {
                max-width: 90%;
                font-size: 14px;
                padding: 10px 14px;
            }

            .input-area {
                padding: 12px 15px 15px;
                flex-wrap: wrap;
            }

            .input-area textarea {
                min-height: 40px;
                font-size: 14px;
            }

            .input-area button {
                padding: 0 20px;
                font-size: 13px;
                width: 100%;
                min-height: 44px;
            }

            .header-actions button {
                padding: 5px 12px;
                font-size: 11px;
            }
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <h1>
                💬 AI Chat
                <span>Empero</span>
            </h1>
            <div class="header-actions">
                <button onclick="clearChat()" class="danger" title="Hapus semua pesan">🗑️ Clear</button>
                <button onclick="resetContext()" title="Reset konteks percakapan">🔄 Reset</button>
                <button onclick="testConnection()" title="Cek koneksi ke API">📡 Test</button>
            </div>
        </div>

        <div class="messages" id="messages">
            <div class="message ai">
                <span class="role-label">🤖 AI</span>
                Halo! Saya AI dari <strong>Empero</strong>.<br>
                Silakan tanyakan apa saja. 😊
                <span class="timestamp">Baru saja</span>
            </div>
        </div>

        <div class="typing-indicator" id="typingIndicator">
            <span></span>
            <span></span>
            <span></span>
        </div>

        <div class="input-area">
            <textarea id="userInput" rows="1" placeholder="Ketik pesan... (Enter untuk kirim)" maxlength="5000"></textarea>
            <button id="sendBtn" onclick="sendMessage()">Kirim ➤</button>
        </div>

        <div class="status-bar">
            <span>
                <span class="status-dot checking" id="statusDot"></span>
                <span id="statusText">Memeriksa koneksi...</span>
            </span>
            <span>Model: Qwen3.8-Flash-Next-FP8</span>
        </div>
    </div>

    <script>
        // =============================================
        // KONFIGURASI
        // =============================================
        const API_URL = 'https://free.empero.org/v1/chat/completions';
        const MODEL = 'Qwen/Qwen3.8-Flash-Next-FP8';
        const API_KEY = 'free';

        // State
        let conversationHistory = [
            { role: 'system', content: 'Anda adalah asisten AI yang ramah dan membantu.' }
        ];
        let isProcessing = false;

        // DOM
        const messagesContainer = document.getElementById('messages');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const typingIndicator = document.getElementById('typingIndicator');
        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');

        // =============================================
        // FUNGSI UTAMA
        // =============================================

        async function sendMessage() {
            const userMessage = userInput.value.trim();
            if (!userMessage || isProcessing) return;

            userInput.value = '';
            userInput.style.height = 'auto';

            appendMessage('user', userMessage);
            conversationHistory.push({ role: 'user', content: userMessage });

            isProcessing = true;
            sendBtn.disabled = true;
            typingIndicator.classList.add('active');
            setStatus('checking', '⏳ Mengirim...');

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${API_KEY}`
                    },
                    body: JSON.stringify({
                        model: MODEL,
                        messages: conversationHistory,
                        max_tokens: 32768,
                        temperature: 0.7
                    })
                });

                if (!response.ok) {
                    let errorMsg = `HTTP ${response.status}`;
                    try {
                        const errorData = await response.json();
                        errorMsg += `: ${errorData.error?.message || JSON.stringify(errorData)}`;
                    } catch {
                        errorMsg += `: ${response.statusText}`;
                    }
                    throw new Error(errorMsg);
                }

                const data = await response.json();
                const aiReply = data.choices?.[0]?.message?.content || 'Maaf, saya tidak bisa merespons saat ini.';

                conversationHistory.push({ role: 'assistant', content: aiReply });
                appendMessage('ai', aiReply);
                setStatus('online', '✅ Online');

            } catch (error) {
                console.error('Error detail:', error);
                
                let errorMessage = error.message;
                if (error.message.includes('Failed to fetch')) {
                    errorMessage = 'Gagal terhubung ke API Empero. Cek koneksi internet atau coba lagi nanti.';
                } else if (error.message.includes('NetworkError')) {
                    errorMessage = 'Masalah jaringan. Pastikan koneksi internet stabil.';
                } else if (error.message.includes('CORS')) {
                    errorMessage = 'Error CORS. Coba gunakan browser Chrome/Edge atau ekstensi CORS.';
                }
                
                appendMessage('error', `❌ ${errorMessage}`);
                setStatus('offline', '⚠️ Error: ' + error.message.substring(0, 30));
            } finally {
                isProcessing = false;
                sendBtn.disabled = false;
                typingIndicator.classList.remove('active');
                userInput.focus();
            }
        }

        function appendMessage(role, content) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${role}`;

            const labelMap = {
                'user': '👤 Anda',
                'ai': '🤖 AI',
                'error': '⚠️ Sistem'
            };
            
            const label = labelMap[role] || '💬';
            const time = new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });

            messageDiv.innerHTML = `
                <span class="role-label">${label}</span>
                ${content.replace(/\n/g, '<br>')}
                <span class="timestamp">${time}</span>
            `;

            messagesContainer.appendChild(messageDiv);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        function clearChat() {
            if (confirm('Hapus semua pesan?')) {
                messagesContainer.innerHTML = '';
                conversationHistory = conversationHistory.filter(msg => msg.role === 'system');
                appendMessage('ai', '🧹 Chat dibersihkan. Silakan mulai percakapan baru!');
                setStatus('online', '✅ Online');
            }
        }

        function resetContext() {
            if (confirm('Reset konteks percakapan?')) {
                const systemPrompt = conversationHistory.find(msg => msg.role === 'system');
                conversationHistory = systemPrompt ? [systemPrompt] : [{ role: 'system', content: 'Anda adalah asisten AI yang ramah dan membantu.' }];
                appendMessage('ai', '🔄 Konteks percakapan direset. Saya siap membantu lagi!');
                setStatus('online', '✅ Online');
            }
        }

        function setStatus(type, text) {
            statusDot.className = `status-dot ${type}`;
            statusText.textContent = text;
        }

        // =============================================
        // TEST KONEKSI (DIPERBAIKI)
        // =============================================
        async function testConnection() {
            setStatus('checking', '📡 Menguji koneksi...');
            
            try {
                // Coba request sederhana ke API
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${API_KEY}`
                    },
                    body: JSON.stringify({
                        model: MODEL,
                        messages: [{ role: 'user', content: 'ping' }],
                        max_tokens: 5,
                        temperature: 0
                    })
                });

                if (response.ok) {
                    setStatus('online', '✅ Koneksi OK - API merespons');
                    appendMessage('ai', '✅ Koneksi ke API Empero berhasil!');
                } else {
                    const errorText = await response.text();
                    setStatus('offline', `⚠️ API error: ${response.status}`);
                    appendMessage('error', `⚠️ API merespons dengan status ${response.status}\n${errorText.substring(0, 100)}`);
                }
            } catch (error) {
                console.error('Test connection error:', error);
                setStatus('offline', '⚠️ Gagal koneksi');
                
                let msg = '❌ Gagal terhubung ke API.\n';
                if (error.message.includes('Failed to fetch')) {
                    msg += 'Cek: 1) Koneksi internet 2) API Empero sedang online 3) CORS blocker';
                } else {
                    msg += error.message;
                }
                appendMessage('error', msg);
            }
        }

        // =============================================
        // EVENT LISTENERS
        // =============================================

        userInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        userInput.addEventListener('input', () => {
            userInput.style.height = 'auto';
            userInput.style.height = Math.min(userInput.scrollHeight, 120) + 'px';
        });

        window.addEventListener('load', () => {
            userInput.focus();
            // Test koneksi otomatis setelah 1 detik
            setTimeout(testConnection, 1000);
        });

        // Shortcut: Ctrl+Enter juga kirim
        userInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && e.ctrlKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        console.log('💬 Chat Room AI siap!');
        console.log(`📡 API: ${API_URL}`);
        console.log(`🧠 Model: ${MODEL}`);
        console.log('🔑 API Key: free (atau apapun)');
    </script>
</body>
</html>
