<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Groq Chat Room</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0a0a0f;
      color: #e5e7eb;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    #app {
      width: 100%;
      max-width: 820px;
      height: 100vh;
      max-height: 750px;
      display: flex;
      flex-direction: column;
      background: #1a1a23;
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8);
      border: 1px solid #2a2a35;
    }
    #header {
      padding: 14px 20px;
      background: #22222f;
      border-bottom: 1px solid #333340;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
    }
    #header h1 {
      font-size: 17px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    #header h1 span {
      background: #4f46e5;
      padding: 2px 10px;
      border-radius: 20px;
      font-size: 10px;
      font-weight: 500;
      color: white;
    }
    #header .status {
      font-size: 12px;
      color: #6b7280;
      background: #11111a;
      padding: 4px 12px;
      border-radius: 20px;
    }
    #header .status.online {
      color: #22c55e;
    }
    #control-area {
      padding: 10px 20px 6px 20px;
      background: #16161f;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      border-bottom: 1px solid #2a2a35;
    }
    #control-area input {
      flex: 2;
      min-width: 160px;
      background: #0e0e16;
      border: 1px solid #333340;
      border-radius: 40px;
      padding: 8px 16px;
      color: white;
      font-size: 13px;
      outline: none;
    }
    #control-area input:focus {
      border-color: #4f46e5;
    }
    #control-area select {
      background: #0e0e16;
      border: 1px solid #333340;
      border-radius: 40px;
      padding: 8px 14px;
      color: white;
      font-size: 13px;
      outline: none;
      cursor: pointer;
    }
    #control-area select:focus {
      border-color: #4f46e5;
    }
    #control-area button {
      background: #374151;
      border: none;
      border-radius: 40px;
      padding: 8px 20px;
      color: white;
      font-size: 13px;
      cursor: pointer;
      transition: background 0.2s;
      white-space: nowrap;
    }
    #control-area button:hover {
      background: #4b5563;
    }
    #control-area button.primary {
      background: #4f46e5;
    }
    #control-area button.primary:hover {
      background: #6366f1;
    }
    .warning-banner {
      background: #3b1a0a;
      border-bottom: 1px solid #6b3a1a;
      padding: 6px 20px;
      font-size: 12px;
      color: #fbbf24;
      text-align: center;
    }
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px 24px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      background: #12121c;
    }
    .message {
      display: flex;
      gap: 10px;
      max-width: 88%;
    }
    .message.user {
      align-self: flex-end;
      flex-direction: row-reverse;
    }
    .message .avatar {
      width: 34px;
      height: 34px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      font-size: 13px;
      flex-shrink: 0;
    }
    .message .bubble {
      background: #2a2a3a;
      padding: 10px 16px;
      border-radius: 16px;
      line-height: 1.5;
      word-break: break-word;
      border: 1px solid #3a3a4a;
      font-size: 14px;
    }
    .message.user .bubble {
      background: #4f46e5;
      border-color: #4f46e5;
      color: white;
      border-bottom-right-radius: 4px;
    }
    .message.assistant .bubble {
      border-bottom-left-radius: 4px;
    }
    .message .avatar.user-avatar {
      background: #4f46e5;
      color: white;
    }
    .message .avatar.assistant-avatar {
      background: #22c55e;
      color: #0a0a0f;
    }
    .typing-indicator {
      display: flex;
      gap: 4px;
      padding: 6px 0;
      align-items: center;
    }
    .typing-indicator span {
      display: inline-block;
      width: 8px;
      height: 8px;
      background: #6b7280;
      border-radius: 50%;
      animation: bounce 1.4s infinite both;
    }
    .typing-indicator span:nth-child(2) {
      animation-delay: 0.2s;
    }
    .typing-indicator span:nth-child(3) {
      animation-delay: 0.4s;
    }
    @keyframes bounce {
      0%,
      80%,
      100% {
        transform: scale(0.6);
        opacity: 0.4;
      }
      40% {
        transform: scale(1);
        opacity: 1;
      }
    }
    #input-area {
      padding: 14px 20px;
      background: #1a1a23;
      border-top: 1px solid #2a2a35;
      display: flex;
      gap: 10px;
    }
    #input-area input {
      flex: 1;
      background: #0e0e16;
      border: 1px solid #333340;
      border-radius: 40px;
      padding: 12px 20px;
      color: white;
      font-size: 15px;
      outline: none;
      transition: border 0.2s;
    }
    #input-area input:focus {
      border-color: #4f46e5;
    }
    #input-area input:disabled {
      opacity: 0.5;
    }
    #input-area button {
      background: #4f46e5;
      border: none;
      border-radius: 40px;
      padding: 0 28px;
      font-weight: 600;
      color: white;
      font-size: 14px;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      white-space: nowrap;
    }
    #input-area button:hover {
      background: #6366f1;
    }
    #input-area button:active {
      transform: scale(0.96);
    }
    #input-area button:disabled {
      opacity: 0.4;
      pointer-events: none;
    }
    .error-message {
      color: #ef4444;
      background: #2a0a0a;
      padding: 10px 16px;
      border-radius: 12px;
      border: 1px solid #4a1a1a;
      text-align: center;
      font-size: 14px;
    }
    @media (max-width: 600px) {
      #app {
        max-height: 100vh;
        border-radius: 0;
        border: none;
      }
      #control-area {
        flex-direction: column;
        align-items: stretch;
      }
      #control-area input,
      #control-area select,
      #control-area button {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div id="app">
    <!-- HEADER -->
    <div id="header">
      <h1>💬 Groq Chat <span>v1</span></h1>
      <div class="status" id="status">● Offline</div>
    </div>

    <!-- KONTROL: API Key + Model -->
    <div id="control-area">
      <input type="password" id="apiKeyInput" placeholder="Masukkan GROQ API Key..." />
      <select id="modelSelect">
        <option value="llama-3.1-8b-instant">llama-3.1-8b-instant</option>
        <option value="llama3-70b-8192">llama3-70b-8192</option>
        <option value="gemma2-9b-it">gemma2-9b-it</option>
        <option value="llama3-8b-8192">llama3-8b-8192</option>
      </select>
      <button id="setKeyBtn" class="primary">Set Key</button>
    </div>
    <div class="warning-banner">
      ⚠️ API Key hanya di memori browser. Jangan bagikan file ini ke orang lain.
    </div>

    <!-- AREA PESAN -->
    <div id="messages">
      <div class="message assistant">
        <div class="avatar assistant-avatar">AI</div>
        <div class="bubble">Halo! Masukkan API Key, pilih model, lalu mulai ngobrol.</div>
      </div>
    </div>

    <!-- INPUT -->
    <div id="input-area">
      <input type="text" id="input" placeholder="Ketik pesan..." disabled />
      <button id="send-btn" disabled>Kirim</button>
    </div>
  </div>

  <script>
    // ================  STATE  ====================
    let API_KEY = '';
    let isReady = false;
    let currentModel = 'llama-3.1-8b-instant';

    const messagesContainer = document.getElementById('messages');
    const inputField = document.getElementById('input');
    const sendBtn = document.getElementById('send-btn');
    const statusEl = document.getElementById('status');
    const apiKeyInput = document.getElementById('apiKeyInput');
    const setKeyBtn = document.getElementById('setKeyBtn');
    const modelSelect = document.getElementById('modelSelect');

    // System prompt (bisa diubah)
    const SYSTEM_PROMPT = 'Kamu adalah asisten yang ramah dan membantu. Jawablah dengan singkat dan jelas dalam bahasa Indonesia.';

    let conversation = [{ role: 'system', content: SYSTEM_PROMPT }];

    // ================  FUNGSI UTILITY  ============
    function updateStatus(online) {
      statusEl.textContent = online ? '● Online' : '● Offline';
      statusEl.className = 'status' + (online ? ' online' : '');
    }

    function addMessage(role, content) {
      if (role !== 'system') {
        conversation.push({ role, content });
      }
      const msgDiv = document.createElement('div');
      msgDiv.className = `message ${role}`;
      const avatar = document.createElement('div');
      avatar.className = `avatar ${role === 'user' ? 'user-avatar' : 'assistant-avatar'}`;
      avatar.textContent = role === 'user' ? 'U' : 'AI';
      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      bubble.textContent = content;
      msgDiv.appendChild(avatar);
      msgDiv.appendChild(bubble);
      messagesContainer.appendChild(msgDiv);
      messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }

    function showTyping() {
      const typingDiv = document.createElement('div');
      typingDiv.className = 'message assistant';
      typingDiv.id = 'typing-indicator';
      const avatar = document.createElement('div');
      avatar.className = 'avatar assistant-avatar';
      avatar.textContent = 'AI';
      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      bubble.innerHTML = `<div class="typing-indicator"><span></span><span></span><span></span></div>`;
      typingDiv.appendChild(avatar);
      typingDiv.appendChild(bubble);
      messagesContainer.appendChild(typingDiv);
      messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }

    function removeTyping() {
      const typing = document.getElementById('typing-indicator');
      if (typing) typing.remove();
    }

    function showError(msg) {
      const errDiv = document.createElement('div');
      errDiv.className = 'error-message';
      errDiv.textContent = `⚠️ ${msg}`;
      messagesContainer.appendChild(errDiv);
      messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }

    // ================  SET API KEY  ===============
    function setApiKey() {
      const key = apiKeyInput.value.trim();
      if (key.startsWith('gsk_') && key.length > 20) {
        API_KEY = key;
        isReady = true;
        sessionStorage.setItem('groq_api_key', key);
        inputField.disabled = false;
        sendBtn.disabled = false;
        updateStatus(true);
        apiKeyInput.value = '';
        apiKeyInput.placeholder = '✅ Key tersimpan';
        inputField.focus();
        addMessage('assistant', '✅ API Key berhasil! Pilih model dan mulai chat.');
      } else {
        alert('❌ API Key tidak valid. Pastikan diawali "gsk_" dan panjangnya > 20 karakter.');
      }
    }

    setKeyBtn.addEventListener('click', setApiKey);
    apiKeyInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') setApiKey();
    });

    // ================  SEND MESSAGE  ===============
    async function sendMessage() {
      if (!isReady) {
        alert('Masukkan API Key dulu!');
        return;
      }

      const text = inputField.value.trim();
      if (!text) return;

      // Ambil model terpilih
      currentModel = modelSelect.value;

      inputField.disabled = true;
      sendBtn.disabled = true;

      addMessage('user', text);
      inputField.value = '';
      showTyping();

      try {
        const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${API_KEY}`
          },
          body: JSON.stringify({
            model: currentModel,
            messages: conversation,
            temperature: 0.7,
            stream: false
          })
        });

        removeTyping();

        if (!response.ok) {
          const errData = await response.json();
          const errMsg = errData.error?.message || `HTTP ${response.status}`;
          throw new Error(errMsg);
        }

        const data = await response.json();
        const reply = data.choices?.[0]?.message?.content || 'Maaf, tidak ada respon.';
        addMessage('assistant', reply);

      } catch (error) {
        removeTyping();
        showError(`Error: ${error.message}`);
        // Jika error karena model, beri saran ganti model
        if (error.message.toLowerCase().includes('model')) {
          showError('💡 Coba ganti model di dropdown di atas. Model yang dipilih mungkin tidak tersedia.');
        }
      } finally {
        inputField.disabled = false;
        sendBtn.disabled = false;
        inputField.focus();
      }
    }

    sendBtn.addEventListener('click', sendMessage);
    inputField.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') sendMessage();
    });

    // ================  RESTORE SESSION  ============
    const savedKey = sessionStorage.getItem('groq_api_key');
    if (savedKey && savedKey.startsWith('gsk_')) {
      API_KEY = savedKey;
      isReady = true;
      inputField.disabled = false;
      sendBtn.disabled = false;
      updateStatus(true);
      apiKeyInput.placeholder = '✅ Key tersimpan (session)';
      // Tambahkan pesan selamat datang
      setTimeout(() => {
        addMessage('assistant', '👋 Selamat datang kembali! Saya siap membantu.');
      }, 300);
    }

    // Ganti model → update info (opsional)
    modelSelect.addEventListener('change', () => {
      if (isReady) {
        const m = modelSelect.value;
        // Tampilkan notifikasi kecil di konsol saja agar tidak spam
        console.log(`Model diganti ke: ${m}`);
      }
    });

    console.log('✅ Groq Chat Room siap!');
  </script>
</body>
</html>
